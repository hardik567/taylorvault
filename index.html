<script>
/*
  TAYLOR VAULT — ALL-IN-ONE SPOTIFY PLAYER
  GitHub Pages compatible: Authorization Code with PKCE.
  IMPORTANT: Never put Spotify Client Secret in this file.
*/

const SPOTIFY_CLIENT_ID = "152a24463c4b4b8da95419b747362fb7";

const SPOTIFY_ALBUM_IDS = {
  "Taylor Swift":"5eyZZoQEFQWRHkV2xgAeBw",
  "Fearless":"2dqn5yOQWdyGwOpOIi9O4x",
  "Speak Now":"5MfAxS5zz8MlfROjGQVXhy",
  "Red":"1EoDsNmgTLtmwe1BDAVxV5",
  "1989":"2QJmrSgbdM35R67eoGQo4j",
  "reputation":"6DEjYFkNZh67HP7R9PSZvv",
  "Lover":"1NAmidJlEaVgA3MpcPFYGq",
  "folklore":"2fenSS68JI1h4Fo296JfGr",
  "evermore":"2Xoteh7uEpea4TohMxjtaq",
  "Fearless (Taylor's Version)":"4hDok0OAJd57SGIT8xuWJH",
  "Red (Taylor's Version)":"6kZ42qRrzov54LcAk4onW9",
  "Speak Now (Taylor's Version)":"5AEDGbliTTfjOB8TSm1sxt",
  "1989 (Taylor's Version)":"64LU4c1nfjz1t4VnGhagcg",
  "Midnights":"151w1FgRZfnKZA9FEcg9Z3",
  "The Tortured Poets Department":"1Mo4aZ8pdj6L1jx8zSwJnt",
  "The Tortured Poets Department — The Anthology":"5H7ixXZfsNMGbIE5OBSpcb",
  "The Life of a Showgirl":"4a6NzYL1YHRUgx9e3YZI6I"
};
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SPOTIFY_SCOPES = [
  "streaming",
  "user-read-email",
  "user-read-private",
  "user-read-playback-state",
  "user-modify-playback-state"
].join(" ");

let tab = "home";
let liked = JSON.parse(localStorage.getItem("tv-liked") || "[]");
let spotifyPlayer = null;
let spotifyDeviceId = null;
let spotifyReady = false;
let currentState = null;
let currentTrackUri = null;
let queueItems = [];
let queueIndex = -1;
let progressTimer = null;
let initializing = false;
let spotifyToken = null;

const $ = id => document.getElementById(id);

function allTracks(){
  return ALBUMS.flatMap(a => a[3].map(title => ({
    title, album:a[0], year:a[1], color:a[2]
  })));
}

function spotifySearchURL(t){
  return "https://open.spotify.com/search/" +
    encodeURIComponent("Taylor Swift " + t.title + " " + t.album);
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function trackKey(t){ return t.title + "||" + t.album; }

function setStatus(message){
  if($("status")) $("status").textContent = message;
}

function formatTime(ms){
  if(!Number.isFinite(ms) || ms < 0) return "0:00";
  const total = Math.floor(ms / 1000);
  return Math.floor(total / 60) + ":" + String(total % 60).padStart(2,"0");
}

/* ---------- PKCE ---------- */

function randomString(length=64){
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
  const bytes = crypto.getRandomValues(new Uint8Array(length));
  return Array.from(bytes, b => chars[b % chars.length]).join("");
}

async function sha256Base64URL(value){
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(value));
  return btoa(String.fromCharCode(...new Uint8Array(digest)))
    .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

async function loginWithSpotify(){
  if(!window.isSecureContext){
    setStatus("Spotify login needs HTTPS.");
    return;
  }

  const verifier = randomString();
  const challenge = await sha256Base64URL(verifier);
  const state = randomString(32);

  sessionStorage.setItem("tv_spotify_verifier", verifier);
  sessionStorage.setItem("tv_spotify_state", state);

  const params = new URLSearchParams({
    client_id: SPOTIFY_CLIENT_ID,
    response_type: "code",
    redirect_uri: REDIRECT_URI,
    code_challenge_method: "S256",
    code_challenge: challenge,
    state,
    scope: SPOTIFY_SCOPES
  });

  window.location.assign("https://accounts.spotify.com/authorize?" + params.toString());
}

async function exchangeCode(code){
  const verifier = sessionStorage.getItem("tv_spotify_verifier");
  if(!verifier) throw new Error("Login session expired. Connect Spotify again.");

  const response = await fetch("https://accounts.spotify.com/api/token", {
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({
      client_id:SPOTIFY_CLIENT_ID,
      grant_type:"authorization_code",
      code,
      redirect_uri:REDIRECT_URI,
      code_verifier:verifier
    })
  });

  const data = await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(data.error_description || data.error || "Spotify login failed.");

  saveTokens(data);
  sessionStorage.removeItem("tv_spotify_verifier");
  sessionStorage.removeItem("tv_spotify_state");
  return data.access_token;
}

function saveTokens(data){
  localStorage.setItem("tv_spotify_access", data.access_token);
  if(data.refresh_token) localStorage.setItem("tv_spotify_refresh", data.refresh_token);
  if(data.expires_in){
    localStorage.setItem("tv_spotify_expiry", String(Date.now() + data.expires_in*1000));
  }
}

async function refreshToken(){
  const refresh = localStorage.getItem("tv_spotify_refresh");
  if(!refresh) return null;

  const response = await fetch("https://accounts.spotify.com/api/token", {
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({
      grant_type:"refresh_token",
      refresh_token:refresh,
      client_id:SPOTIFY_CLIENT_ID
    })
  });

  const data = await response.json().catch(()=>({}));
  if(!response.ok){
    logoutSpotify(false);
    return null;
  }
  saveTokens(data);
  return data.access_token;
}

async function getToken(){
  const token = localStorage.getItem("tv_spotify_access");
  const expiry = Number(localStorage.getItem("tv_spotify_expiry") || 0);

  if(token && (!expiry || Date.now() < expiry - 60000)) return token;
  return await refreshToken();
}

async function handleCallback(){
  const params = new URLSearchParams(window.location.search);
  const error = params.get("error");
  const code = params.get("code");

  if(error){
    setStatus("Spotify login cancelled.");
    cleanURL();
    return false;
  }
  if(!code) return false;

  const state = params.get("state");
  const savedState = sessionStorage.getItem("tv_spotify_state");

  if(!savedState || state !== savedState){
    setStatus("Spotify security check failed. Connect again.");
    cleanURL();
    return false;
  }

  try{
    setStatus("Connecting Spotify...");
    await exchangeCode(code);
    cleanURL();
    return true;
  }catch(e){
    console.error(e);
    setStatus(e.message);
    cleanURL();
    return false;
  }
}

function cleanURL(){
  window.history.replaceState({}, document.title, REDIRECT_URI);
}

/* ---------- Spotify Web Playback ---------- */

window.onSpotifyWebPlaybackSDKReady = async function(){
  if(initializing || spotifyPlayer) return;
  initializing = true;

  const token = await getToken();
  if(!token){
    initializing = false;
    updateConnectButton();
    return;
  }

  spotifyPlayer = new Spotify.Player({
    name:"Taylor Vault",
    getOAuthToken: async cb => {
      const fresh = await getToken();
      cb(fresh);
    },
    volume:Number($("volume")?.value || 0.7)
  });

  spotifyPlayer.addListener("ready", ({device_id}) => {
    spotifyDeviceId = device_id;
    spotifyReady = true;
    setStatus("Spotify connected ✓");
    updateConnectButton();
  });

  spotifyPlayer.addListener("not_ready", ({device_id}) => {
    if(device_id === spotifyDeviceId) spotifyReady = false;
    setStatus("Spotify player disconnected.");
  });

  spotifyPlayer.addListener("player_state_changed", state => {
    if(!state) return;
    currentState = state;
    currentTrackUri = state.track_window?.current_track?.uri || null;
    updatePlayerUI(state);
    highlightCurrentTrack();
  });

  spotifyPlayer.addListener("initialization_error", ({message}) => {
    console.error("Spotify initialization_error:", message);
    setStatus("Spotify player initialization failed.");
  });

  spotifyPlayer.addListener("authentication_error", ({message}) => {
    console.error("Spotify authentication_error:", message);
    setStatus("Spotify authentication expired. Connect again.");
    logoutSpotify(false);
  });

  spotifyPlayer.addListener("account_error", ({message}) => {
    console.error("Spotify account_error:", message);
    setStatus("This Spotify account cannot use web playback. Premium is required.");
  });

  spotifyPlayer.addListener("playback_error", ({message}) => {
    console.error("Spotify playback_error:", message);
    setStatus("Spotify playback error: " + message);
  });

  spotifyPlayer.addListener("autoplay_failed", () => {
    setStatus("Browser blocked autoplay — click Play again.");
  });

  const connected = await spotifyPlayer.connect();
  if(!connected) setStatus("Could not connect to Spotify player.");
  initializing = false;
  updateConnectButton();
};

async function ensurePlayer(){
  const token = await getToken();
  if(!token){
    await loginWithSpotify();
    return false;
  }

  if(!spotifyPlayer){
    if(window.Spotify && window.onSpotifyWebPlaybackSDKReady){
      await window.onSpotifyWebPlaybackSDKReady();
    }
  }

  if(!spotifyPlayer) return false;

  if(!spotifyDeviceId){
    setStatus("Waiting for Spotify browser device...");
    try{
      await waitForDevice();
    }catch(e){
      setStatus(e.message);
      return false;
    }
  }

  return true;
}

function waitForDevice(timeout=15000){
  return new Promise((resolve,reject)=>{
    const started = Date.now();
    const timer = setInterval(()=>{
      if(spotifyDeviceId){
        clearInterval(timer);
        resolve(spotifyDeviceId);
      }else if(Date.now()-started > timeout){
        clearInterval(timer);
        reject(new Error("Spotify browser player did not become ready."));
      }
    },200);
  });
}

async function transferPlayback(token){
  const response = await fetch("https://api.spotify.com/v1/me/player", {
    method:"PUT",
    headers:{
      Authorization:"Bearer " + token,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      device_ids:[spotifyDeviceId],
      play:false
    })
  });

  if(!response.ok && response.status !== 204){
    const data = await response.json().catch(()=>({}));
    throw new Error(data.error?.message || "Could not transfer Spotify playback.");
  }
}

async function searchSpotifyTrack(track){
  const token = await getToken();
  if(!token) throw new Error("Connect Spotify first.");

  const albumName = track.album;
  let albumId = SPOTIFY_ALBUM_IDS[albumName];

  // TTPD in this catalog contains tracks from both the standard album and Anthology.
  // Check both albums without using Spotify Search.
  const albumIds = [];
  if(albumId) albumIds.push(albumId);
  if(albumName === "The Tortured Poets Department"){
    albumIds.push(SPOTIFY_ALBUM_IDS["The Tortured Poets Department — The Anthology"]);
  }

  const normalize = s => String(s || "")
    .toLowerCase()
    .replace(/[’']/g,"'")
    .replace(/\s+/g," ")
    .trim();

  const baseTitle = normalize(track.title)
    .replace(/\s*\(taylor's version\)/g,"")
    .replace(/\s*\(from the vault\)/g,"")
    .replace(/\s*\(from the vault\)/g,"")
    .replace(/\s*\(feat\.[^)]+\)/g,"")
    .trim();

  for(const id of albumIds){
    let offset = 0;
    while(true){
      const response = await fetch(
        `https://api.spotify.com/v1/albums/${encodeURIComponent(id)}/tracks?limit=50&offset=${offset}`,
        {headers:{Authorization:"Bearer " + token}}
      );
      const data = await response.json().catch(()=>({}));

      if(!response.ok){
        if(response.status === 401) throw new Error("Spotify login expired. Connect again.");
        if(response.status === 403) throw new Error("Spotify API denied this account (403). Make sure this Spotify account is added to your app's Users Management.");
        if(response.status === 429) throw new Error("Spotify API rate limit reached (429). Please wait a moment and try again.");
        throw new Error(data.error?.message || `Spotify album lookup failed (${response.status}).`);
      }

      const tracks = data.items || [];
      const exact = tracks.find(x => {
        const n = normalize(x.name);
        return n === normalize(track.title) ||
               n.replace(/\s*\(taylor's version\)/g,"").replace(/\s*\(from the vault\)/g,"").trim() === baseTitle;
      });
      if(exact) return exact;

      if(!data.next || !tracks.length) break;
      offset += tracks.length;
    }
  }

  throw new Error(`Track not found in the Spotify album catalog: ${track.title}`);
}

async function playTrack(track, items=queueItems, index=queueIndex){
  queueItems = items?.length ? items : allTracks();
  queueIndex = Number.isInteger(index) ? index : queueItems.findIndex(x => trackKey(x) === trackKey(track));

  const ok = await ensurePlayer();
  if(!ok) return;

  try{
    const token = await getToken();

    // Must be triggered by the user's interaction.
    try{ await spotifyPlayer.activateElement(); }catch(e){}

    setStatus("Loading track from Spotify album...");
    const spotifyTrack = await searchSpotifyTrack(track);

    setStatus("Starting " + spotifyTrack.name + "...");

    await transferPlayback(token);

    const playResponse = await fetch(
      "https://api.spotify.com/v1/me/player/play?device_id=" +
      encodeURIComponent(spotifyDeviceId),
      {
        method:"PUT",
        headers:{
          Authorization:"Bearer " + token,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({uris:[spotifyTrack.uri]})
      }
    );

    if(!playResponse.ok){
      const data = await playResponse.json().catch(()=>({}));
      if(playResponse.status === 403){
        throw new Error(data.error?.message || "Spotify playback was denied (403). Check Premium and app user authorization.");
      }
      throw new Error(data.error?.message || "Spotify could not play this track.");
    }

    currentTrackUri = spotifyTrack.uri;
    setStatus("Playing • Spotify ✓");
  }catch(e){
    console.error(e);
    setStatus(e.message || "Could not play the song.");
  }
}

async function togglePlay(){
  const ok = await ensurePlayer();
  if(!ok) return;

  try{
    await spotifyPlayer.activateElement();
    await spotifyPlayer.togglePlay();
  }catch(e){
    console.error(e);
    setStatus("Could not change playback: " + e.message);
  }
}

async function previousTrack(){
  if(!spotifyPlayer) return;
  try{ await spotifyPlayer.previousTrack(); }
  catch(e){ setStatus("Previous track failed."); }
}

async function nextTrack(){
  if(spotifyPlayer && currentState?.track_window?.next_tracks?.length){
    try{ await spotifyPlayer.nextTrack(); return; }catch(e){}
  }
  if(queueItems.length){
    const next = queueIndex + 1;
    if(next < queueItems.length) await playTrack(queueItems[next], queueItems, next);
  }
}

async function seekFromBar(){
  if(!spotifyPlayer || !currentState?.duration) return;
  const value = Number($("progress").value);
  const position = Math.round(currentState.duration * value / 1000);
  try{ await spotifyPlayer.seek(position); }catch(e){ console.error(e); }
}

async function setVolume(value){
  if(!spotifyPlayer) return;
  try{ await spotifyPlayer.setVolume(Number(value)); }catch(e){ console.error(e); }
}

/* ---------- UI ---------- */

function updatePlayerUI(state){
  const track = state.track_window?.current_track;
  if(!track) return;

  $("title").textContent = track.name;
  $("album").textContent = track.artists.map(a=>a.name).join(", ");
  $("playBtn").textContent = state.paused ? "▶" : "⏸";
  $("status").textContent = state.paused ? "Paused • Spotify" : "Playing • Spotify ✓";

  $("currentTime").textContent = formatTime(state.position);
  $("duration").textContent = formatTime(state.duration);

  if(state.duration){
    $("progress").value = Math.round(state.position / state.duration * 1000);
  }

  startProgressTimer();
}

function startProgressTimer(){
  clearInterval(progressTimer);
  progressTimer = setInterval(async()=>{
    if(!spotifyPlayer || !currentState || currentState.paused) return;
    try{
      const state = await spotifyPlayer.getCurrentState();
      if(state){
        currentState = state;
        $("currentTime").textContent = formatTime(state.position);
        $("duration").textContent = formatTime(state.duration);
        if(state.duration) $("progress").value = Math.round(state.position/state.duration*1000);
      }
    }catch(e){}
  },500);
}

function updateConnectButton(){
  const b = $("spotifyConnect");
  if(!b) return;

  const token = localStorage.getItem("tv_spotify_access");
  if(token){
    b.textContent = spotifyReady ? "Spotify Connected ✓" : "Spotify Connected";
    b.classList.toggle("connected", true);
    b.onclick = () => logoutSpotify(true);
  }else{
    b.textContent = "Connect Spotify";
    b.classList.remove("connected");
    b.onclick = loginWithSpotify;
  }
}

function logoutSpotify(show=true){
  if(spotifyPlayer){
    try{ spotifyPlayer.disconnect(); }catch(e){}
  }
  spotifyPlayer=null;
  spotifyDeviceId=null;
  spotifyReady=false;
  currentState=null;

  ["tv_spotify_access","tv_spotify_refresh","tv_spotify_expiry"].forEach(k=>localStorage.removeItem(k));

  updateConnectButton();
  if(show) setStatus("Spotify disconnected.");
}

function highlightCurrentTrack(){
  document.querySelectorAll(".track").forEach(row=>{
    row.classList.remove("playing");
    const uri = row.dataset.spotifyUri;
    if(uri && uri === currentTrackUri) row.classList.add("playing");
  });
}

/* ---------- Catalog ---------- */

function card(a,i){
  const img=ALBUM_IMAGES[a[0]]||"";
  return `<div class="card" data-album="${i}">
    <div class="cover" style="background:${a[2]}">
      ${img?`<img src="${img}" alt="${escapeHTML(a[0])} album artwork" loading="lazy" onerror="this.style.display='none'">`:escapeHTML(a[0])}
    </div>
    <b>${escapeHTML(a[0])}</b>
    <small>${a[1]} • ${a[3].length} tracks</small>
  </div>`;
}

function list(items){
  if(!items.length) return '<div class="tracks"><div class="empty">No songs found.</div></div>';

  return '<div class="tracks">' + items.map((t,i)=>{
    const d=encodeURIComponent(JSON.stringify(t));
    const likedIcon=liked.includes(trackKey(t)) ? "♥" : "♡";
    return `<div class="track" data-track-key="${escapeHTML(trackKey(t))}">
      <span>${i+1}</span>
      <div class="info" data-open="${d}"><b>${escapeHTML(t.title)}</b><small>${escapeHTML(t.album)}</small></div>
      <button data-like="${d}" title="Like">${likedIcon}</button>
      <button class="round" data-open="${d}" title="Play">▶</button>
    </div>`;
  }).join("") + "</div>";
}

function render(){
  const q=$("search").value.toLowerCase();
  const items=allTracks().filter(t=>
    (t.title+" "+t.album).toLowerCase().includes(q)
  );

  let h="";
  if(tab==="home") h=`
    <section class="hero">
      <small>THE TAYLOR VAULT</small>
      <h1>Every era.<br>One place.</h1>
      <p>A Taylor Swift-only website. Browse the catalog, see album artwork, save favorites and play tracks through your connected Spotify account.</p>
      <button class="btn" id="browseSongs">Browse Songs</button>
      <button class="btn muted" id="browseAlbums">Browse Albums</button>
    </section>
    <h2>Albums</h2><div class="grid">${ALBUMS.map(card).join("")}</div>`;
  if(tab==="albums") h=`<h1>Albums</h1><div class="grid">${ALBUMS.map(card).join("")}</div>`;
  if(tab==="songs") h=`<h1>All Taylor Swift Songs</h1>${list(items)}`;
  if(tab==="liked") h=`<h1>Liked Songs</h1>${list(items.filter(t=>liked.includes(trackKey(t))))}`;

  $("content").innerHTML=h;

  document.querySelectorAll("[data-album]").forEach(x =>
    x.onclick=()=>albumPage(+x.dataset.album)
  );

  document.querySelectorAll("[data-open]").forEach(x =>
    x.onclick=e=>{
      e.stopPropagation();
      const t=JSON.parse(decodeURIComponent(x.dataset.open));
      const visible = currentVisibleItems();
      const idx = visible.findIndex(v=>trackKey(v)===trackKey(t));
      playTrack(t, visible, idx);
    }
  );

  document.querySelectorAll("[data-like]").forEach(x =>
    x.onclick=e=>{
      e.stopPropagation();
      const t=JSON.parse(decodeURIComponent(x.dataset.like));
      toggleLike(trackKey(t));
    }
  );

  if($("browseSongs")) $("browseSongs").onclick=()=>{
    tab="songs"; setNav(); render();
  };
  if($("browseAlbums")) $("browseAlbums").onclick=()=>{
    tab="albums"; setNav(); render();
  };

  highlightCurrentTrack();
}

function currentVisibleItems(){
  const q=$("search").value.toLowerCase();
  if(tab==="liked") return allTracks().filter(t=>liked.includes(trackKey(t)));
  if(tab==="songs") return allTracks().filter(t=>(t.title+" "+t.album).toLowerCase().includes(q));
  return allTracks();
}

function toggleLike(id){
  liked=liked.includes(id)?liked.filter(x=>x!==id):[...liked,id];
  localStorage.setItem("tv-liked",JSON.stringify(liked));
  render();
}

function albumPage(i){
  const a=ALBUMS[i];
  const items=a[3].map(title=>({title,album:a[0],year:a[1],color:a[2]}));

  $("content").innerHTML=
    `<h1>${escapeHTML(a[0])}</h1>
     <p style="color:#888">${a[1]} • Taylor Swift</p>${list(items)}`;

  document.querySelectorAll("[data-open]").forEach(x =>
    x.onclick=e=>{
      e.stopPropagation();
      const t=JSON.parse(decodeURIComponent(x.dataset.open));
      const idx=items.findIndex(v=>trackKey(v)===trackKey(t));
      playTrack(t,items,idx);
    }
  );

  document.querySelectorAll("[data-like]").forEach(x =>
    x.onclick=e=>{
      e.stopPropagation();
      const t=JSON.parse(decodeURIComponent(x.dataset.like));
      toggleLike(trackKey(t));
    }
  );

  highlightCurrentTrack();
}

function setNav(){
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle("active",b.dataset.tab===tab)
  );
}

/* ---------- Events ---------- */

$("search").oninput=render;

document.querySelectorAll("nav button").forEach(b =>
  b.onclick=()=>{
    tab=b.dataset.tab;
    setNav();
    render();
  }
);

$("playBtn").onclick=togglePlay;
$("prevBtn").onclick=previousTrack;
$("nextBtn").onclick=nextTrack;
$("progress").oninput=seekFromBar;
$("volume").oninput=e=>setVolume(e.target.value);
$("spotifyConnect").onclick=loginWithSpotify;

/* ---------- Startup ---------- */

(async()=>{
  updateConnectButton();

  const callbackHandled = await handleCallback();
  const token = await getToken();

  if(token){
    spotifyToken = token;
    if(window.Spotify && window.onSpotifyWebPlaybackSDKReady){
      window.onSpotifyWebPlaybackSDKReady();
    }
  }else if(!callbackHandled){
    setStatus("Connect Spotify to play here");
  }

  render();
})();
</script>
