["Fearless (Taylor's Version)","2021","#d4b23e",["Fearless (Taylor's Version)","Love Story (Taylor's Version)","You Belong With Me (Taylor's Version)","Mr. Perfectly Fine (From the Vault)","You All Over Me (From the Vault)","We Were Happy (From the Vault)","That’s When (From the Vault)","Don’t You (From the Vault)","Bye Bye Baby (From the Vault)","Forever & Always (Piano Version) (Taylor’s Version)","Tell Me Why (Taylor’s Version)","The Other Side of the Door (Taylor’s Version)"]],

["Midnights","2022","#666b9d",["Lavender Haze", "Maroon", "Anti-Hero", "Snow on the Beach", "You\u2019re on Your Own, Kid", "Midnight Rain", "Question...?", "Vigilante Shit", "Bejeweled", "Labyrinth", "Karma", "Sweet Nothing", "Mastermind", "The Great War", "Bigger Than the Whole Sky", "Paris", "High Infidelity", "Glitch", "Would\u2019ve Could\u2019ve Should\u2019ve", "Dear Reader", "Hits Different", "You\u2019re Losing Me"]],

["The Tortured Poets Department","2024","#b99a70",["Fortnight", "The Tortured Poets Department", "My Boy Only Breaks His Favorite Toys", "Down Bad", "So Long, London","I Can Do It With a Broken Heart","The Smallest Man Who Ever Lived","The Black Dog","imgonnagetyouback","The Alchemy","Clara Bow","Florida!!!","Who\u2019s Afraid of Little Old Me?","I Look in People\u2019s Windows","I Can Fix Him (No Really I Can)","loml","I Can Do It With a Broken Heart","The Manuscript","The Albatross","Chloe or Sam or Sophia or Marcus","How Did It End?","So High School","I Hate It Here","thanK you aIMee","I Look in People\u2019s Windows","The Prophecy","Cassandra","Peter","The Bolter","Robin","The Manuscript"]],
["The Life of a Showgirl","2025","#a66773",["The Fate of Ophelia", "Elizabeth Taylor", "Opalite", "Father Figure", "Eldest Daughter", "Ruin The Friendship", "Actually Romantic", "Wi$h Li$t", "Wood", "CANCELLED!", "Honey", "The Life of a Showgirl"]]

let tab="home",liked=JSON.parse(localStorage.getItem("tv-liked")||"[]");
const $=id=>document.getElementById(id);
function allTracks(){return ALBUMS.flatMap(a=>a[3].map(title=>({title,album:a[0],year:a[1],color:a[2]})))}
function spotify(t){return "https://open.spotify.com/search/"+encodeURIComponent("Taylor Swift "+t.title+" "+t.album)}
function openSpotify(t){$("title").textContent=t.title;$("album").textContent=t.album;$("status").textContent="Opening Spotify…";window.open(spotify(t),"_blank","noopener,noreferrer")}
function toggleLike(id){liked=liked.includes(id)?liked.filter(x=>x!==id):[...liked,id];localStorage.setItem("tv-liked",JSON.stringify(liked));render()}
function card(a,i){
 const img=ALBUM_IMAGES[a[0]]||"";
 return `<div class="card" data-album="${i}"><div class="cover" id="cover${i}" style="background:${a[2]}">${img?`<img src="${img}" alt="${a[0]} album artwork" loading="lazy" onerror="this.style.display='none'">`:a[0]}</div><b>${a[0]}</b><small>${a[1]} • ${a[3].length} tracks</small></div>`;
}
function list(items){if(!items.length)return '<div class="tracks"><div class="empty">No songs found.</div></div>';return '<div class="tracks">'+items.map((t,i)=>{const d=encodeURIComponent(JSON.stringify(t));return `<div class="track"><span>${i+1}</span><div class="info" data-open="${d}"><b>${t.title}</b><small>${t.album}</small></div><button data-like="${encodeURIComponent(t.title)}">${liked.includes(t.title)?"♥":"♡"}</button><button class="round" data-open="${d}">▶</button></div>`}).join("")+"</div>"}
function render(){
 const q=$("search").value.toLowerCase();
 const items=allTracks().filter(t=>(t.title+" "+t.album).toLowerCase().includes(q));
 let h="";
 if(tab==="home")h=`<section class="hero"><small>THE TAYLOR VAULT</small><h1>Every era.<br>One place.</h1><p>A Taylor Swift-only website. Browse the catalog, see album artwork, save favorites and jump directly to Spotify for the real song.</p><button class="btn" onclick="tab='songs';setNav();render()">Browse Songs</button><button class="btn muted" onclick="tab='albums';setNav();render()">Browse Albums</button></section><h2>Albums</h2><div class="grid">${ALBUMS.map(card).join("")}</div>`;
 if(tab==="albums")h=`<h1>Albums</h1><div class="grid">${ALBUMS.map(card).join("")}</div>`;
 if(tab==="songs")h=`<h1>All Taylor Swift Songs</h1>${list(items)}`;
 if(tab==="liked")h=`<h1>Liked Songs</h1>${list(items.filter(t=>liked.includes(t.title)))}`;
 $("content").innerHTML=h;
 document.querySelectorAll("[data-album]").forEach(x=>x.onclick=()=>albumPage(+x.dataset.album));
 document.querySelectorAll("[data-open]").forEach(x=>x.onclick=()=>openSpotify(JSON.parse(decodeURIComponent(x.dataset.open))));
 document.querySelectorAll("[data-like]").forEach(x=>x.onclick=e=>{e.stopPropagation();toggleLike(decodeURIComponent(x.dataset.like))});
 loadArtwork();
}
function albumPage(i){
 const a=ALBUMS[i];
 $("content").innerHTML=`<h1>${a[0]}</h1><p style="color:#888">${a[1]} • Taylor Swift</p>${list(a[3].map(title=>({title,album:a[0],year:a[1],color:a[2]})))}`;
 document.querySelectorAll("[data-open]").forEach(x=>x.onclick=()=>openSpotify(JSON.parse(decodeURIComponent(x.dataset.open))));
 document.querySelectorAll("[data-like]").forEach(x=>x.onclick=e=>{e.stopPropagation();toggleLike(decodeURIComponent(x.dataset.like))});
}
function loadArtwork(){}
function setNav(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab))}
$("search").oninput=render;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;setNav();render()});
render();
</script>
